# /etc/ssh/sshd_config.d/99-hardening.conf  (round 2 only)
# Requires a working SSH key for every allowed user BEFORE reloading sshd.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication yes
# Key AND one-time code (TOTP via PAM); see mfa.md
AuthenticationMethods publickey,keyboard-interactive
MaxAuthTries 3
LoginGraceTime 30
AllowUsers labadmin labuser
X11Forwarding no
